<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Happy Birthday ✨</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Inter',sans-serif;background:#0B1426;color:#FAFAFA;overflow:hidden;height:100vh;width:100vw;user-select:none}

/* ── STAGE & SLIDES ─────────────────────────────────── */
.stage{width:100vw;height:100vh;position:relative}
.slide{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:52px 40px 80px;opacity:0;transform:scale(1.04);transition:opacity 0.7s ease,transform 0.7s ease;pointer-events:none}
.slide.active{opacity:1;transform:scale(1);pointer-events:all}
.slide.exiting{opacity:0;transform:scale(0.97)}

/* ── BACKGROUNDS ────────────────────────────────────── */
.s0{background:radial-gradient(ellipse at 30% 40%,#1a2d5a 0%,#0b1426 55%,#0d0d20 100%)}
.s1{background:radial-gradient(ellipse at 60% 30%,#1e3d1e 0%,#0f2010 55%,#0a150a 100%)}
.s2{background:radial-gradient(ellipse at 40% 60%,#0f2535 0%,#081820 55%,#040e15 100%)}
.s3{background:radial-gradient(ellipse at 50% 40%,#2e1800 0%,#1a0e00 55%,#0d0700 100%)}
.s4{background:radial-gradient(ellipse at 35% 55%,#120838 0%,#09042a 55%,#040215 100%)}
.s5{background:radial-gradient(ellipse at 65% 35%,#2a0e1a 0%,#1a0710 55%,#0e040a 100%)}
.s6{background:radial-gradient(ellipse at 55% 25%,#231205 0%,#150c03 55%,#0d0702 100%)}
.s7{background:radial-gradient(ellipse at 45% 45%,#2d0a18 0%,#1c0510 55%,#0f030a 100%)}
.s8{background:radial-gradient(ellipse at 50% 50%,#0d1830 0%,#060f1e 55%,#030810 100%)}
.s9{background:radial-gradient(ellipse at 50% 50%,#1a1400 0%,#2a2000 40%,#0d0800 100%)}

/* subtle star dust on all slides */
.slide::before{content:'';position:absolute;inset:0;background-image:radial-gradient(1px 1px at 20% 30%,rgba(255,255,255,0.14) 0%,transparent 100%),radial-gradient(1px 1px at 78% 68%,rgba(255,255,255,0.09) 0%,transparent 100%),radial-gradient(1.5px 1.5px at 54% 18%,rgba(255,255,255,0.11) 0%,transparent 100%),radial-gradient(1px 1px at 36% 82%,rgba(255,255,255,0.07) 0%,transparent 100%);pointer-events:none}

/* ── ACCENT COLORS ──────────────────────────────────── */
.s0{--acc:#D4A843}.s1{--acc:#7DC47C}.s2{--acc:#7EC4D8}.s3{--acc:#D4A843}.s4{--acc:#9B8FE0}.s5{--acc:#D4849A}.s6{--acc:#D4B06A}.s7{--acc:#C47898}.s8{--acc:#D4A843}.s9{--acc:#D4A843}

/* ── CONTENT ANIMATION ──────────────────────────────── */
.si{position:relative;z-index:1;max-width:700px;width:100%;animation:cIn 0.8s ease 0.3s both}
@keyframes cIn{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}

/* ── TYPOGRAPHY ─────────────────────────────────────── */
.eyebrow{font-size:11px;font-weight:500;letter-spacing:0.25em;text-transform:uppercase;margin-bottom:20px;color:var(--acc)}
.headline{font-family:'Playfair Display',serif;font-size:clamp(42px,8vw,82px);font-weight:700;line-height:1.05;letter-spacing:-0.02em;margin-bottom:6px}
.headline-sub{font-family:'Playfair Display',serif;font-size:clamp(38px,7vw,72px);font-weight:400;font-style:italic;line-height:1.05}
.subtext{font-size:clamp(14px,2.2vw,17px);font-weight:300;line-height:1.7;opacity:0.78;margin-top:26px;max-width:520px;margin-left:auto;margin-right:auto}
.detail{font-size:11px;font-weight:500;letter-spacing:0.18em;text-transform:uppercase;opacity:0.4;margin-top:28px}

/* ── ART DECO DIVIDER (signature element) ───────────── */
.dr{display:flex;align-items:center;justify-content:center;gap:10px;margin:18px 0 24px;color:var(--acc)}
.dr::before,.dr::after{content:'';flex:1;max-width:80px;height:1px;background:currentColor;opacity:0.4}
.dr span{font-size:10px;opacity:0.5;letter-spacing:0.em;text-transform:uppercase;font-weight:400
